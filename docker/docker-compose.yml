
services:
  vllm-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vllm-api-service
    restart: unless-stopped
    ipc: host  # CRITICAL: Shares host memory for PyTorch CUDA IPC & vLLM PagedAttention
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
      - QUANTIZATION=${QUANTIZATION:-}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.90}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-4096}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-32}
      - DEVICE=${DEVICE:-cuda}
      - API_KEY=${API_KEY:-}
      - DOWNLOAD_DIR=/workspace/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf-cache:/workspace/.cache/huggingface
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vllm-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: vllm-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vllm-network
    depends_on:
      vllm-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: vllm-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=/prometheus
      - --web.route-prefix=/

    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - vllm-network

  grafana:
    image: grafana/grafana:latest
    container_name: vllm-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

    volumes:
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - vllm-network
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: vllm-node-exporter
    restart: unless-stopped
    profiles: ["exporters"]
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    pid: host
    networks:
      - vllm-network

  dcgm-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: vllm-dcgm-exporter
    restart: unless-stopped
    profiles: ["exporters"]
    ports:
      - "9400:9400"
    networks:
      - vllm-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  vllm-network:
    driver: bridge

volumes:
  hf-cache:
  prometheus-data:
  grafana-data:
