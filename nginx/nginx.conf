worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting zone: Protects vLLM backend from API floods (10 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=llm_api_limit:10m rate=10r/s;

    upstream vllm_backend {
        server vllm-api:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Health Check Endpoint Pass-Through (Bypasses Rate Limit)
        location /health/ {
            proxy_pass http://vllm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Metrics Endpoint (Restricted to internal network / scrapers)
        location /metrics {
            proxy_pass http://vllm_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # OpenAI API Proxying (Chat Completions & Completions)
        location /v1/ {
            # Apply rate limiting with bursting
            limit_req zone=llm_api_limit burst=20 nodelay;

            proxy_pass http://vllm_backend;
            proxy_http_version 1.1;

            # HTTP Keep-Alive settings
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- CRITICAL LLM STREAMING SETTINGS ---
            # Disable buffering so Server-Sent Events (SSE) stream tokens instantly
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Extend timeouts for long prefill & output generation phases
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
        
        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }                   

        # Root Endpoint Fallback
        location / {
            return 200 '{"status":"online","service":"Enterprise vLLM Platform","version":"1.0.0"}';
            add_header Content-Type application/json;
        }
    }
}
